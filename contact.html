<section class="page-head">
  <div class="site-shell">
    <div class="eyebrow">Contact</div>
    <h1>Contact</h1>
    <p>For engineering consulting, engineering education, writing, speaking, or general inquiries.</p>
  </div>
</section>

<section class="section compact">
  <div class="site-shell">
    <div class="grid-2">
      <div class="card">
        <h2>Send a Message</h2>
        <form class="contact-form" action="https://formsubmit.co/erick.sokn@synergymoldingtech.com" method="POST">
          <input type="hidden" name="_subject" value="Website inquiry — synergymoldingtech.com">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="false">

          <label>Name
            <input type="text" name="name" required autocomplete="name">
          </label>

          <label>Email
            <input type="email" name="email" required autocomplete="email">
          </label>

          <label>Inquiry Type
            <select name="inquiry_type">
              <option>Engineering Consulting</option>
              <option>Engineering Education</option>
              <option>Writing</option>
              <option>Speaking</option>
              <option>General Inquiry</option>
            </select>
          </label>

          <label>Subject
            <input type="text" name="subject">
          </label>

          <label>Message
            <textarea name="message" required></textarea>
          </label>

          <button class="button" type="submit">Send Message</button>
        </form>
      </div>

    </div>
  </div>
</section>
