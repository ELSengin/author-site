<meta charset="utf-8">

<body class="reader-body">
<div class="reader-shell" id="reader-shell">
  <header class="reader-topbar">
    <div class="reader-title">The Avatar — Illustrated Edition</div>
    <a class="reader-exit" href="writing.html#book-list">Return to Writing</a>
  </header>

  <main class="reader-stage" id="reader-stage" aria-label="The Avatar illustrated poem reader">
    <img class="reader-page" id="reader-page" src="" alt="" draggable="false">
  </main>

  <nav class="reader-controls" aria-label="Book navigation">
    <button class="reader-button" id="reader-previous" type="button" aria-label="Previous page">← <span class="wide-label">Previous</span></button>
    <div class="reader-status" id="reader-indicator" aria-live="polite"></div>
    <button class="reader-button" id="reader-next" type="button" aria-label="Next page"><span class="wide-label">Next</span> →</button>
    <button class="reader-button" id="reader-fullscreen" type="button">Full Screen</button>
  </nav>

  <section class="reader-feedback" id="reader-feedback" hidden aria-labelledby="reader-feedback-title">
    <div class="reader-feedback-inner">
      <h2 id="reader-feedback-title">Share a thought</h2>
      <p>I’d be interested in what you thought of <em>The Avatar</em>.</p>
      <form id="reader-feedback-form" action="https://formsubmit.co/cf03cfc702e7c53e10493c70ad1f0f52" method="POST">
        <input type="hidden" name="_subject" value="Reader thought — The Avatar">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="work" value="The Avatar">

        <label>Your thought
          <textarea name="message" required maxlength="3000"></textarea>
        </label>

        <label>Name <span>(optional)</span>
          <input type="text" name="name" autocomplete="name" maxlength="100">
        </label>

        <label>Email <span>(optional — only if you’d like a reply)</span>
          <input type="email" name="email" autocomplete="email" maxlength="254">
        </label>

        <div class="reader-feedback-actions">
          <button class="reader-button" type="submit">Send thought</button>
          <button class="reader-button" id="reader-feedback-cancel" type="button">Cancel</button>
        </div>
        <p class="reader-feedback-status" id="reader-feedback-status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</div>
